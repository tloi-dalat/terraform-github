online-judge:
  profile: service
  teams:
    sre: maintain
    swe: push
  checks:
    main: &online-judge-checks
      - lint
      - unit
      - styles
      - check-migrations / migrations
      - check-i18n / i18n
      - check-i18n-django / i18n
      - check-templates / templates
      - check-workflows / workflows
      - check-docker / docker
      - check-dependencies / dependencies
      - check-title / title
    release:
      - *online-judge-checks
      - check-source / source

judge-server:
  profile: service
  teams:
    sre: maintain
    swe: push
  checks:
    main: &judge-server-checks
      - lint
      - mypy
      - test-sdist
      - check-workflows / workflows
      - check-docker / docker
      - check-dependencies / dependencies
      - check-title / title
    release:
      - *judge-server-checks
      - check-source / source

landing-page:
  profile: service
  teams:
    sre: maintain
    swe: push
  checks:
    main: &landing-page-checks
      - check-workflows / workflows
      - check-docker / docker
      - check-title / title
    release:
      - *landing-page-checks
      - check-source / source

control-plane:
  profile: platform
  bypass:
    main: [tloi-ci]
  teams:
    sre: maintain
    swe: push
  checks:
    main:
      - lint / lint
      - check-title / title

reusable-workflow:
  profile: platform
  teams:
    sre: maintain
    swe: push
  checks:
    main: [actionlint, check-title / title]

charts:
  profile: platform
  teams:
    sre: maintain
    swe: push
  checks:
    main: [lint]

terraform-cloudflare:
  profile: platform
  bypass:
    merge: [tloi-atlantis]
  teams:
    sre: maintain
    swe: push
  checks:
    main: [check-terraform / terraform, check-title / title]

terraform-github:
  profile: platform
  bypass:
    merge: [tloi-atlantis]
  teams:
    sre: maintain
    swe: push
  checks:
    main: [check-terraform / terraform, check-title / title]

.github:
  profile: platform
  teams:
    sre: maintain
    swe: push
