online-judge:
  profile: app
  teams:
    sre: maintain
    swe: push
  checks:
    main: &oj-checks
      - lint
      - unit
      - styles
      - check-migrations / migrations
      - check-i18n / i18n
      - check-i18n-django / i18n
      - check-templates / templates
      - check-workflows / workflows
      - check-docker / docker
      - check-dependencies / dependencies
      - check-title / title
    release:
      - *oj-checks
      - check-source / source

judge-server:
  profile: app
  teams:
    sre: maintain
    swe: push
  checks:
    main: &judge-checks
      - lint
      - mypy
      - test-sdist
      - check-workflows / workflows
      - check-docker / docker
      - check-dependencies / dependencies
      - check-title / title
    release:
      - *judge-checks
      - check-source / source

control-plane:
  profile: gitops
  teams:
    sre: maintain
    swe: push
  checks:
    main:
      - lint / lint
      - check-title / title

reusable-workflow:
  profile: library
  teams:
    sre: maintain
    swe: push
  checks:
    main: [actionlint, check-title / title]

charts:
  profile: library
  teams:
    sre: maintain
    swe: push
  checks:
    main: [lint]

terraform-cloudflare:
  profile: library
  atlantis: true
  teams:
    sre: maintain
    swe: push
  checks:
    main: [check-terraform / terraform, check-title / title]

terraform-github:
  profile: library
  atlantis: true
  teams:
    sre: maintain
    swe: push
  checks:
    main: [check-terraform / terraform, check-title / title]

.github:
  profile: library
  teams:
    sre: maintain
    swe: push

status:
  profile: gitops 
  teams:
    sre: maintain
    swe: push 