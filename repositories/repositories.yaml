online-judge:
  profile: service
  bypass:
    main: [tloi-ci]
  teams:
    sre: maintain
    swe: push
  checks:
    main:
      - &online-judge-checks
        - check-flake8 / flake8
        - check-tests / tests
        - check-node / node
        - check-i18n / i18n
        - check-i18n-django / i18n
        - check-templates / templates
        - check-workflows / workflows
        - check-docker / docker
        - check-dependencies / dependencies
        - check-title / title
      - atlas-generator / migration-status
    release:
      - *online-judge-checks
      - check-source / source

judge-server:
  profile: service
  bypass:
    main: [tloi-ci]
  teams:
    sre: maintain
    swe: push
  checks:
    main: &judge-server-checks
      - check-flake8 / flake8
      - check-clang-format / clang-format
      - check-mypy / mypy
      - check-sdist / sdist
      - check-workflows / workflows
      - check-docker / docker
      - check-dependencies / dependencies
      - check-title / title
    release:
      - *judge-server-checks
      - check-source / source

online-quiz:
  profile: service
  teams:
    sre: maintain
    swe: push
  checks:
    main:
      - &online-quiz-checks
        - check-flake8 / flake8
        - check-tests / tests
        - check-templates / templates
        - check-workflows / workflows
        - check-docker / docker
        - check-dependencies / dependencies
        - check-title / title
      - atlas-generator / migration-status
    release:
      - *online-quiz-checks
      - check-source / source

landing-page:
  profile: service
  teams:
    sre: maintain
    swe: push
  checks:
    main: &landing-page-checks
      - check-workflows / workflows
      - check-docker / docker
      - check-title / title
    release:
      - *landing-page-checks
      - check-source / source

maintenance-page:
  profile: service
  teams:
    sre: maintain
    swe: push
  checks:
    main: &maintenance-page-checks
      - check-title / title
    release:
      - *maintenance-page-checks
      - check-source / source

control-plane:
  profile: platform
  bypass:
    main: [tloi-ci]
  teams:
    sre: maintain
    swe: push
  checks:
    main:
      - lint / lint
      - check-title / title

atlas-migration:
  profile: platform
  up_to_date: true
  teams:
    sre: maintain
    swe: push
  checks:
    main: [check-numbering / numbering, check-replay / replay, check-title / title]

reusable-workflow:
  profile: platform
  teams:
    sre: maintain
    swe: push
  checks:
    main: [actionlint, check-title / title]

charts:
  profile: platform
  teams:
    sre: maintain
    swe: push
  checks:
    main: [lint]

terraform-cloudflare:
  profile: platform
  bypass:
    merge: [tloi-atlantis]
  teams:
    sre: maintain
    swe: push
  checks:
    main: [check-terraform / terraform, check-title / title]

terraform-github:
  profile: platform
  bypass:
    merge: [tloi-atlantis]
  teams:
    sre: maintain
    swe: push
  checks:
    main: [check-terraform / terraform, check-title / title]

.github:
  profile: platform
  teams:
    sre: maintain
    swe: push
