name: terraform
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  TF_VERSION: 1.16.5
  TF_IN_AUTOMATION: '1'
  TF_INPUT: '0'
  TF_VAR_github_app_id: ${{ secrets.TERRAFORM_APP_ID }}
  TF_VAR_github_app_installation_id: ${{ secrets.TERRAFORM_APP_INSTALLATION_ID }}
  TF_VAR_github_app_private_key: ${{ secrets.TERRAFORM_APP_PRIVATE_KEY }}
  TF_VAR_ci_app_id: ${{ secrets.CI_APP_ID }}
  AWS_ENDPOINT_URL_S3: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        workspace: [repositories]
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: fmt
        id: fmt
        run: terraform fmt -check -recursive -diff
      - name: init
        id: init
        if: always()
        run: terraform init -no-color
      - name: validate
        id: validate
        if: always() && steps.init.outcome == 'success'
        run: terraform validate -no-color
      - name: test (mocked providers)
        id: test
        if: always() && steps.init.outcome == 'success'
        run: terraform test -no-color
      - name: plan
        id: plan
        if: always() && steps.init.outcome == 'success'
        run: |
          set -o pipefail
          code=0
          terraform plan -lock=false -no-color -detailed-exitcode -out=tfplan 2>&1 | tee "$RUNNER_TEMP/plan.log" || code=$?
          if [[ $code == 2 || $code == 0 ]]; then
            terraform show -no-color tfplan > "$RUNNER_TEMP/plan.txt"
          else
            cp "$RUNNER_TEMP/plan.log" "$RUNNER_TEMP/plan.txt"
          fi
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          [[ $code != 1 ]]

      - name: comment the plan on the PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          WS: ${{ matrix.workspace }}
          PR: ${{ github.event.pull_request.number }}
          PLAN_EXIT: ${{ steps.plan.outputs.exitcode }}
        run: |
          set -euo pipefail
          marker="<!-- terraform-plan:${WS} -->"

          summary="Plan not run"
          if [[ -f "$RUNNER_TEMP/plan.txt" ]]; then
            case "$PLAN_EXIT" in
              0) summary="No changes." ;;
              2) summary=$(grep -E '^Plan: ' "$RUNNER_TEMP/plan.txt" | tail -1 || echo "Changes present") ;;
              *) summary="Plan failed" ;;
            esac
          fi

          {
            echo "$marker"
            echo "### Terraform \`${WS}\`: ${summary}"
            echo
            if [[ -f "$RUNNER_TEMP/plan.txt" ]]; then
              echo "<details><summary>Plan output</summary>"
              echo
              echo '```hcl'
              if [[ $(wc -c < "$RUNNER_TEMP/plan.txt") -gt 60000 ]]; then
                head -c 60000 "$RUNNER_TEMP/plan.txt"
                echo
                echo "… truncated, full plan in the run log"
              else
                cat "$RUNNER_TEMP/plan.txt"
              fi
              echo '```'
              echo
              echo "</details>"
            fi
          } > "$RUNNER_TEMP/comment.md"

          cat "$RUNNER_TEMP/comment.md" >> "$GITHUB_STEP_SUMMARY"

          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
                       --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -n1)
          if [[ -n "$existing" ]]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" \
              -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
              -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
          fi

  apply:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: terraform-apply
      cancel-in-progress: false
    strategy:
      max-parallel: 1
      matrix:
        workspace: [repositories]
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: init
        run: terraform init
      - name: apply
        run: terraform apply -lock=false -auto-approve
